# Netlify configuration.
#
# Netlify detects Next.js on its own and provisions the current adapter, which
# turns the App Router pages into server-rendered functions and each route under
# src/app/api into a serverless function — including the Stripe webhook. So this
# file only pins the things worth pinning.
#
# Environment variables are NOT set here. They are set in the Netlify UI under
# Site configuration → Environment variables, so secrets never enter the repo.
# See "Deploying to Netlify" in the README for which ones are needed.

[build]
  command = "npm run build"

[build.environment]
  # Next 16 declares engines.node ">=20.9.0" — note the .9. A bare "20" can
  # resolve to an earlier 20.x and fail the build before it compiles anything,
  # so this pins a major that is unambiguously above the floor. Verified: the
  # production build passes on Node 22 from a clean install.
  NODE_VERSION = "22"

  # Do NOT set NODE_ENV=production as a build variable here or in the Netlify
  # UI. Tailwind, PostCSS and TypeScript are devDependencies, and npm skips
  # devDependencies under that flag — the install would succeed and the build
  # would then fail on a missing tailwind. Netlify's default already builds
  # with devDependencies installed.

  # Netlify scans the build for the literal values of secret environment
  # variables and fails the deploy if it finds one. It was matching
  # PRINTFUL_API_KEY inside Next's *build cache* — the Turbopack .sst files
  # under .next/cache — which the storefront needs a token to produce at all,
  # since it prerenders the catalog.
  #
  # Only the cache is exempted, and deliberately so:
  #
  #   * .next/cache is build state, not served output. Netlify restores it
  #     between builds for speed; it is never addressable by a visitor.
  #   * Everything that IS served stays scanned. If the token ever leaked into
  #     a page, a bundle, or a function, the build still fails — which is the
  #     protection worth keeping.
  #
  # Scoped to paths rather than SECRETS_SCAN_OMIT_KEYS (which would stop
  # checking this key everywhere) or SECRETS_SCAN_ENABLED=false (which would
  # switch scanning off entirely). Both are the blunt versions of this fix.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

# Long-lived caching for the build's fingerprinted assets. Their filenames
# change whenever the contents do, so they can be cached indefinitely.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Modest hardening. No CSP here: the app loads its own fonts and inlines
    # SVG product placeholders as data URIs, and a wrong policy would break
    # the shop silently rather than loudly.
    x-content-type-options = "nosniff"
    referrer-policy = "strict-origin-when-cross-origin"
    x-frame-options = "SAMEORIGIN"
